name: bewosy_app
description: Bewosy – Complete Business Management App
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^14.0.0

  # State management
  provider: ^6.1.0

  # HTTP
  dio: ^5.4.0

  # Secure token storage
  flutter_secure_storage: ^9.0.0

  # Key-value storage
  shared_preferences: ^2.2.0

  # Charts
  fl_chart: ^0.69.0

  # Formatting
  intl: ^0.19.0

  # WhatsApp / share
  url_launcher: ^6.2.0

  # Image picker
  image_picker: ^1.1.0

  # PDF / printing for invoices
  pdf: ^3.10.0
  printing: ^5.12.0

  # Connectivity
  connectivity_plus: ^6.0.0

  # Toast
  fluttertoast: ^8.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
