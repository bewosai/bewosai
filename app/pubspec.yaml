name: bewosai_app
description: Bewosai – Complete Business Management App
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^14.0.0

  # State management
  provider: ^6.1.0

  # HTTP
  dio: ^5.4.0

  # Secure token storage
  flutter_secure_storage: ^10.3.1

  # Charts
  fl_chart: ^0.69.0

  # Formatting
  intl: ^0.20.2

  # WhatsApp / share
  url_launcher: ^6.2.0

  # Image picker
  image_picker: ^1.1.0

  # PDF / printing for invoices
  pdf: ^3.10.0
  printing: ^5.12.0

  # Connectivity
  connectivity_plus: ^6.0.0

  # Toast
  fluttertoast: ^10.0.0

  # Share files / PDFs
  share_plus: ^13.3.0

  # path provider (for temp file saves: PDF, etc.)
  path_provider: ^2.1.4

  # App version info
  package_info_plus: ^10.2.1

  # Typography
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.0
  nepali_utils: ^3.0.8

  # On-device scheduled notifications (payment due-date reminders)
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4

  # Offline local cache + pending-write outbox
  sqflite: ^2.4.1
  path: ^1.9.0

  # Google Sign-In
  google_sign_in: ^6.2.2

  # Excel bulk import (pick + parse + generate template .xlsx)
  file_picker: ^12.0.0
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2+1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
