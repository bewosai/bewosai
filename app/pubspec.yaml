name: bewosai_app
description: Bewosai – Complete Business Management App
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^14.0.0

  # State management
  provider: ^6.1.0

  # HTTP
  dio: ^5.4.0

  # Secure token storage
  flutter_secure_storage: ^10.3.1

  # Charts
  fl_chart: ^0.69.0

  # Formatting
  intl: ^0.19.0

  # WhatsApp / share
  url_launcher: ^6.2.0

  # Image picker
  image_picker: ^1.1.0

  # PDF / printing for invoices
  pdf: ^3.10.0
  printing: ^5.12.0

  # Connectivity
  connectivity_plus: ^6.0.0

  # Toast
  fluttertoast: ^10.0.0

  # Share files / PDFs
  share_plus: ^13.3.0

  # path provider (for temp file saves: PDF, etc.)
  path_provider: ^2.1.4

  # App version info
  package_info_plus: ^10.2.1

  # Typography
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.0
  nepali_utils: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
