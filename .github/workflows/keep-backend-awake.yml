# Render's free plan puts the backend to sleep after 15 idle minutes, and the
# next visitor then waits about a minute for it to start. Pinging the root URL
# (a plain "ok", no database work) every few minutes keeps it awake. Free for a
# public repo; one always-on service fits inside Render's 750 free hours/month.
name: Keep backend awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 https://bewosai-backend-0esi.onrender.com/
