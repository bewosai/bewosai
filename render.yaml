databases:
  - name: bewosai-db
    plan: free
    databaseName: bewosai
    user: bewosai

services:
  - type: web
    name: bewosai-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput"
    startCommand: "gunicorn bewosai.wsgi --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://bewosaiapp.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://bewosaiapp.vercel.app"
      # Auto-provisioned and wired by the "bewosai-db" database above — no
      # manual DATABASE_URL entry needed.
      - key: DATABASE_URL
        fromDatabase:
          name: bewosai-db
          property: connectionString
      # Optional — leave blank to have OTPs print to the Render log instead
      # of sending real email.
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
