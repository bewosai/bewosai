<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Mobile-first viewport — prevents zoom on input focus on iOS -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <title>Bewosy – Business Management</title>
    <meta name="description" content="Manage sales, inventory, expenses, customers, staff, and reports in one place." />

    <!-- PWA / App install -->
    <meta name="application-name" content="Bewosy" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bewosy" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f59e0b" />

    <!-- Safe area insets for iOS notch/home indicator -->
    <style>
      :root {
        --safe-area-inset-top: env(safe-area-inset-top, 0px);
        --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
        --safe-area-inset-left: env(safe-area-inset-left, 0px);
        --safe-area-inset-right: env(safe-area-inset-right, 0px);
      }
      /* Prevent content-shift on textarea/input focus on mobile */
      * { -webkit-tap-highlight-color: transparent; }
    </style>

    <!-- Prevent layout shifts when switching between light/dark -->
    <script>
      (function () {
        var t = localStorage.getItem("bw_theme") || "light";
        if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
